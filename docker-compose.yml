name: taskforge

services:
  # -------------------------------------------------------------------------
  # Reverse proxy — point d'entrée unique de la stack
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7
    container_name: taskforge-traefik
    command:
      # Découverte automatique des conteneurs via le socket Docker
      - --providers.docker=true
      # Seuls les services portant traefik.enable=true sont exposés
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      # Lecture seule : Traefik n'a besoin que d'observer les conteneurs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal

  # -------------------------------------------------------------------------
  # Base de données
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: taskforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Conservé pour permettre la connexion d'un client SQL externe.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Le backend attend cette sonde avant de démarrer : sans elle, il tente
      # de se connecter à une base qui n'accepte pas encore les connexions.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # API NestJS — exposée sur api.taskforge.localhost
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: development
    container_name: taskforge-backend
    init: true
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: ${BACKEND_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      # Code source monté pour le hot-reload
      - ./backend:/app
      # Volume anonyme : protège le node_modules de l'image, que le montage
      # ci-dessus écraserait sinon.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=${BACKEND_PORT}

  # -------------------------------------------------------------------------
  # Interface Vue 3 — exposée sur taskforge.localhost
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: taskforge-frontend
    init: true
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=5173

volumes:
  pgdata: