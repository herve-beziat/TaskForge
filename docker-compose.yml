name: taskforge

services:
  # -------------------------------------------------------------------------
  # Reverse proxy — point d'entrée unique de la stack
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7
    container_name: taskforge-traefik
    restart: unless-stopped
    command:
      # Découverte automatique des conteneurs via le socket Docker
      - --providers.docker=true
      # Seuls les services portant traefik.enable=true sont exposés
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --api.dashboard=true
      # Active l'endpoint interrogé par « traefik healthcheck »
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      # Lecture seule : Traefik n'a besoin que d'observer les conteneurs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
      - autoheal=true

  # -------------------------------------------------------------------------
  # Base de données
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: taskforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Conservé pour permettre la connexion d'un client SQL externe.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Le backend attend cette sonde avant de démarrer : sans elle, il tente
      # de se connecter à une base qui n'accepte pas encore les connexions.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - autoheal=true

  # -------------------------------------------------------------------------
  # API NestJS — exposée sur api.taskforge.localhost
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: development
    container_name: taskforge-backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: ${BACKEND_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: ${LOG_DIR}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      # Code source monté pour le hot-reload
      - ./backend:/app
      # Volume anonyme : protège le node_modules de l'image, que le montage
      # ci-dessus écraserait sinon.
      - /app/node_modules
      # Volume nommé partagé : centralise les logs JSON hors du conteneur,
      # de sorte qu'ils survivent à sa suppression.
      - logs:/var/log/taskforge
    healthcheck:
      # /health interroge réellement PostgreSQL et renvoie 503 si la base
      # ne répond pas : la sonde couvre bien l'API et sa dépendance.
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # En développement, Nest compile le TypeScript avant d'écouter :
      # une sonde trop pressée le déclarerait défaillant pendant son
      # démarrage normal.
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=${BACKEND_PORT}
      - autoheal=true

  # -------------------------------------------------------------------------
  # Interface Vue 3 — exposée sur taskforge.localhost
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: taskforge-frontend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      # Servi par un greffon Vite en développement, par nginx en production.
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5173/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=5173
      - autoheal=true

  # -------------------------------------------------------------------------
  # Redémarrage automatique des conteneurs défaillants
  #
  # « restart: unless-stopped » ne relance qu'un conteneur dont le processus
  # s'est arrêté. Un conteneur dont la sonde échoue alors que le processus
  # tourne encore resterait en place indéfiniment : c'est ce que ce service
  # corrige, en surveillant les sondes et en redémarrant ce qui est marqué
  # « unhealthy ».
  # -------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: taskforge-autoheal
    restart: unless-stopped
    environment:
      # Ne surveille que les services portant le label autoheal.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 60
    volumes:
      # En écriture, contrairement au socket de Traefik : redémarrer un
      # conteneur est une opération d'écriture. Concession de sécurité assumée.
      - /var/run/docker.sock:/var/run/docker.sock

  # -------------------------------------------------------------------------
  # Observabilité — Prometheus collecte, Grafana affiche
  #
  # Bonus « Pour aller plus loin ». L'endpoint /metrics existait depuis TECH09
  # sans que rien ne le consomme : ces deux services lui donnent un usage.
  #
  # Développement uniquement : les porter en production supposerait de traiter
  # le mot de passe, l'exposition de Prometheus et la rétention comme des
  # sujets de production. Hors cadre pour un bonus.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: taskforge-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Quinze jours : borne la croissance du volume sans priver d'historique.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_DOMAIN}`)
      - traefik.http.routers.prometheus.entrypoints=web
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:11.4.0
    container_name: taskforge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: http://${GRAFANA_DOMAIN}
      # Aucune création de compte : un Grafana ouvert à l'inscription sur un
      # poste de démonstration est une porte inutile.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Coupe la télémétrie et la vérification de mise à jour : rien à envoyer
      # depuis un environnement local.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      # En lecture seule : le dépôt fait autorité, le conteneur ne réécrit pas
      # sa propre configuration.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000

volumes:
  pgdata:
  logs:
  prometheus-data:
  grafana-data:
