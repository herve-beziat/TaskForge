server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Vue Router gère les routes côté navigateur : /tickets/42 ne correspond
    # à aucun fichier réel. Sans ce repli, nginx renverrait 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers générés par Vite portent une empreinte dans leur nom
    # (index-a3f9c2.js) : le nom change à chaque build, donc le contenu
    # peut être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sonde de disponibilité côté frontend, exigée par le sujet.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}